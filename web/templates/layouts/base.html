{{ define "base" }}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <!-- Google Font: Vazirmatn -->
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200/80">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <a href="/" class="flex items-center gap-2 hover:opacity-90 transition">
                        <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 font-extrabold text-xl shadow-xs">
                            🚀
                        </span>
                        <span class="text-slate-900 font-extrabold text-lg">وبلاگ Go</span>
                    </a>
                </div>

                <!-- Navigation Links -->
                <nav class="flex items-center gap-1 sm:gap-2">
                    <a href="/" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-100/70 rounded-lg transition">
                        صفحه اصلی
                    </a>
                    <a href="/blog" class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-100/70 rounded-lg transition">
                        وبلاگ
                    </a>
                    <a href="/admin/blog" class="inline-flex items-center gap-1.5 ms-2 px-3.5 py-2 text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition border border-indigo-100 shadow-xs">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                        </svg>
                        <span>پنل مدیریت</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        {{ template "content" . }}
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200/80 bg-white py-6">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <p>توسعه یافته با زبان Go و کامپایل فوق سریع Tailwind CSS</p>
            <p dir="ltr">Powered by Go &amp; SQLite</p>
        </div>
    </footer>
</body>
</html>
{{ end }}
